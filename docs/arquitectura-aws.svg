<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura AWS de EduStream</title>
  <desc id="desc">Diagrama de la solución implementada y los componentes pendientes de implementar para EduStream.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity=".15"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #fff; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #dbeafe; }
      .section { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .card-title { font: 700 19px Arial, sans-serif; fill: #0f172a; }
      .card-text { font: 400 16px Arial, sans-serif; fill: #334155; }
      .small { font: 400 14px Arial, sans-serif; fill: #475569; }
      .badge { font: 700 14px Arial, sans-serif; }
      .legend { font: 400 15px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f8fafc"/>
  <rect width="1600" height="128" fill="url(#header)"/>
  <text x="70" y="58" class="title">EduStream — Arquitectura AWS</text>
  <text x="70" y="91" class="subtitle">Estado de la entrega intermedia: solución implementada y trabajo pendiente</text>
  <text x="1530" y="58" text-anchor="end" class="subtitle">Actualizado: noviembre de 2026</text>

  <rect x="55" y="165" width="1030" height="590" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="85" y="207" class="section">Implementado / preparado</text>
  <rect x="85" y="225" width="210" height="45" rx="22" fill="#dcfce7"/>
  <text x="190" y="254" text-anchor="middle" class="badge" fill="#166534">IMPLEMENTADO</text>

  <g filter="url(#shadow)">
    <rect x="105" y="320" width="245" height="150" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="227" y="357" text-anchor="middle" class="card-title">Cliente / Frontend</text>
    <text x="127" y="391" class="card-text">React + TypeScript + Vite</text>
    <text x="127" y="418" class="card-text">Ejecución local documentada</text>
    <text x="127" y="446" class="small">json-server para pruebas locales</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="435" y="292" width="300" height="205" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="585" y="329" text-anchor="middle" class="card-title">Amazon EC2</text>
    <text x="457" y="363" class="card-text">Amazon Linux 2023</text>
    <text x="457" y="390" class="card-text">Security Group: TCP 8000</text>
    <rect x="475" y="412" width="220" height="62" rx="10" fill="#dbeafe"/>
    <text x="585" y="438" text-anchor="middle" class="card-title">Docker</text>
    <text x="585" y="461" text-anchor="middle" class="small">FastAPI + Uvicorn</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="810" y="320" width="220" height="150" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="920" y="357" text-anchor="middle" class="card-title">Amazon DynamoDB</text>
    <text x="832" y="391" class="card-text">EduStream_Videos</text>
    <text x="832" y="418" class="card-text">PK: video_id (String)</text>
    <text x="832" y="446" class="small">GetItem, PutItem, Scan</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="435" y="555" width="300" height="130" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="585" y="592" text-anchor="middle" class="card-title">IAM Instance Profile</text>
    <text x="585" y="625" text-anchor="middle" class="card-text">Rol autorizado para DynamoDB</text>
    <text x="585" y="653" text-anchor="middle" class="small">Sin credenciales dentro de la imagen</text>
  </g>

  <line x1="350" y1="395" x2="435" y2="395" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="392" y="379" text-anchor="middle" class="small">HTTP</text>
  <line x1="735" y1="395" x2="810" y2="395" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="772" y="379" text-anchor="middle" class="small">boto3</text>
  <line x1="585" y1="497" x2="585" y2="555" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="605" y="530" class="small">IAM</text>

  <rect x="1115" y="165" width="430" height="590" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="1145" y="207" class="section">Pendiente de implementar / verificar</text>
  <rect x="1145" y="225" width="150" height="45" rx="22" fill="#ffedd5"/>
  <text x="1220" y="254" text-anchor="middle" class="badge" fill="#9a3412">PENDIENTE</text>

  <g filter="url(#shadow)">
    <rect x="1160" y="320" width="340" height="105" rx="14" fill="#fff" stroke="#f97316" stroke-width="2"/>
    <text x="1330" y="357" text-anchor="middle" class="card-title">Amazon API Gateway</text>
    <text x="1330" y="388" text-anchor="middle" class="card-text">HTTP proxy hacia EC2</text>
    <text x="1330" y="412" text-anchor="middle" class="small">Stage previsto: dev</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1160" y="465" width="340" height="105" rx="14" fill="#fff" stroke="#f97316" stroke-width="2"/>
    <text x="1330" y="502" text-anchor="middle" class="card-title">Amazon S3</text>
    <text x="1330" y="533" text-anchor="middle" class="card-text">Archivos y miniaturas</text>
    <text x="1330" y="557" text-anchor="middle" class="small">No verificado en este incremento</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1160" y="610" width="340" height="105" rx="14" fill="#fff" stroke="#f97316" stroke-width="2"/>
    <text x="1330" y="647" text-anchor="middle" class="card-title">Integración y seguridad</text>
    <text x="1330" y="678" text-anchor="middle" class="card-text">Frontend con AWS, CORS y auth</text>
    <text x="1330" y="702" text-anchor="middle" class="small">Edición y eliminación también pendientes</text>
  </g>

  <path d="M350 430 C560 520, 820 280, 1160 370" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-gray)"/>
  <text x="885" y="294" text-anchor="middle" class="small">Conectividad futura</text>

  <rect x="55" y="800" width="1490" height="115" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="85" y="840" class="section">Flujo objetivo de la entrega</text>
  <text x="85" y="875" class="legend">Cliente → API Gateway → EC2/Docker/FastAPI → DynamoDB</text>
  <line x1="735" y1="864" x2="780" y2="864" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="815" y="875" class="legend">El acceso directo a EC2:8000 es temporal y restringido</text>
  <circle cx="1325" cy="862" r="8" fill="#2563eb"/>
  <text x="1343" y="868" class="legend">Implementado</text>
  <circle cx="1450" cy="862" r="8" fill="#f97316"/>
  <text x="1468" y="868" class="legend">Pendiente</text>
</svg>
