<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1060" viewBox="0 0 1680 1060" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura AWS Desplegada — EduStream</title>
  <desc id="description">Arquitectura en la nube desplegada en AWS us-east-1 para EduStream: Frontend en S3 con API Gateway HTTPS proxy, autenticacion Cognito OIDC con grupos, API Gateway v2 para el backend en EC2 Docker FastAPI con IAM LabRole, persistencia en DynamoDB con TTL y almacenamiento de videos en S3 privado con subida directa y reproduccion mediante URLs prefirmadas.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 28px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 15px; fill: #475569; }
      .card-title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .card-header-text { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .card-copy { font-size: 13.5px; fill: #334155; }
      .small { font-size: 12.5px; fill: #475569; }
      .code-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; fill: #1e293b; }
      .edge-label { font-size: 12.5px; font-weight: 700; paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
      .edge { fill: none; stroke-width: 2.5; }
    </style>
  </defs>

  <!-- Fondo general -->
  <rect width="1680" height="1060" fill="#ffffff"/>

  <!-- Encabezado -->
  <text x="48" y="46" class="title">EduStream · Arquitectura Integral en Amazon Web Services</text>
  <text x="48" y="74" class="subtitle">Topología de producción desplegada en AWS us-east-1 · Integración completa Frontend, Auth, Backend, Datos y Almacenamiento</text>

  <!-- Contenedor Principal AWS Cloud -->
  <rect x="360" y="98" width="1275" height="928" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="1425" y="112" width="195" height="34" rx="17" fill="#1e293b"/>
  <text x="1522" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">AWS Cloud · us-east-1</text>

  <!-- CLIENTE / USUARIO -->
  <rect x="44" y="320" width="280" height="280" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <rect x="44" y="320" width="280" height="42" rx="16" fill="#475569"/>
  <path d="M44 348h280v14H44z" fill="#475569"/>
  <text x="66" y="347" class="card-header-text">Cliente Web (Navegador)</text>

  <circle cx="86" cy="405" r="18" fill="#3b82f6"/>
  <text x="86" y="411" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">D</text>
  <text x="116" y="402" class="card-title">Docente</text>
  <text x="116" y="419" class="small">docente@iteso.mx · Publica / Borra</text>

  <circle cx="86" cy="458" r="18" fill="#10b981"/>
  <text x="86" y="464" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">A</text>
  <text x="116" y="455" class="card-title">Alumno</text>
  <text x="116" y="472" class="small">alumno@iteso.mx · Catálogo / Streaming</text>

  <line x1="62" y1="495" x2="304" y2="495" stroke="#cbd5e1" stroke-width="1"/>
  <text x="64" y="520" class="card-title">Single Page Application</text>
  <text x="64" y="542" class="card-copy">React 18 + TypeScript + Vite</text>
  <rect x="64" y="555" width="238" height="28" rx="6" fill="#e2e8f0"/>
  <text x="183" y="574" text-anchor="middle" class="code-tag">OIDC PKCE + S3 Direct Upload</text>

  <!-- ================= CAPA DE DISTRIBUCIÓN FRONTEND ================= -->
  <!-- API Gateway Frontend Proxy -->
  <rect x="400" y="165" width="280" height="145" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <rect x="400" y="165" width="280" height="38" rx="14" fill="#0d9488"/>
  <path d="M400 190h280v13H400z" fill="#0d9488"/>
  <text x="420" y="191" class="card-header-text">API Gateway (Frontend Proxy)</text>
  <text x="420" y="232" class="card-title">HTTP API: 4q76jvcjwa</text>
  <text x="420" y="254" class="card-copy">Terminación SSL / HTTPS para SPA</text>
  <rect x="418" y="266" width="244" height="28" rx="6" fill="#f0fdfa"/>
  <text x="540" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">Proxy a S3 Static Website</text>

  <!-- S3 Frontend Bucket -->
  <rect x="735" y="165" width="280" height="145" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="735" y="165" width="280" height="38" rx="14" fill="#0284c7"/>
  <path d="M735 190h280v13H735z" fill="#0284c7"/>
  <text x="755" y="191" class="card-header-text">Amazon S3 · Hosting Estático</text>
  <text x="755" y="232" class="card-title">edustream-frontend-jdavila</text>
  <text x="755" y="254" class="card-copy">Static Website Hosting (index.html)</text>
  <rect x="753" y="266" width="244" height="28" rx="6" fill="#f0f9ff"/>
  <text x="875" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">Public Read Policy · SPA Routing</text>

  <!-- ================= CAPA DE IDENTIDAD (COGNITO) ================= -->
  <rect x="1070" y="165" width="310" height="145" rx="14" fill="#ffffff" stroke="#a21caf" stroke-width="2"/>
  <rect x="1070" y="165" width="310" height="38" rx="14" fill="#a21caf"/>
  <path d="M1070 190h310v13H1070z" fill="#a21caf"/>
  <text x="1090" y="191" class="card-header-text">Amazon Cognito · Identidad</text>
  <text x="1090" y="232" class="card-title">User Pool: us-east-1_rNhUTDMSd</text>
  <text x="1090" y="254" class="card-copy">Hosted UI: edustream-auth-jdavila</text>
  <rect x="1088" y="266" width="274" height="28" rx="6" fill="#fdf4ff"/>
  <text x="1225" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#86198f">Grupos: docentes y alumnos (JWT)</text>

  <!-- ================= CAPA DE API BACKEND ================= -->
  <!-- API Gateway Backend API -->
  <rect x="400" y="420" width="280" height="160" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="400" y="420" width="280" height="38" rx="14" fill="#7c3aed"/>
  <path d="M400 445h280v13H400z" fill="#7c3aed"/>
  <text x="420" y="446" class="card-header-text">API Gateway (Backend API)</text>
  <text x="420" y="486" class="card-title">HTTP API: j72eps3z3f</text>
  <text x="420" y="508" class="card-copy">Integración HTTP directa a EC2:8000</text>
  <text x="420" y="528" class="small">CORS Origins: * · Métodos REST</text>
  <rect x="418" y="540" width="244" height="26" rx="6" fill="#f5f3ff"/>
  <text x="540" y="557" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">Proxy inverso transparente</text>

  <!-- ================= CAPA DE RED Y CÓMPUTO (VPC + EC2) ================= -->
  <!-- VPC -->
  <rect x="735" y="375" width="460" height="395" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="755" y="390" width="160" height="30" rx="15" fill="#2563eb"/>
  <text x="835" y="410" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Amazon VPC</text>

  <!-- Subred Pública -->
  <rect x="755" y="432" width="420" height="320" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="770" y="445" width="170" height="26" rx="13" fill="#dbeafe"/>
  <text x="855" y="463" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Subred Pública (us-east-1d)</text>

  <!-- Instancia EC2 -->
  <rect x="775" y="488" width="380" height="248" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <rect x="775" y="488" width="380" height="38" rx="12" fill="#ea580c"/>
  <path d="M775 513h380v13H775z" fill="#ea580c"/>
  <text x="795" y="513" class="card-header-text">Amazon EC2 (i-0da66503c5157fdcd)</text>
  <text x="795" y="553" class="card-title">Docker · FastAPI (Uvicorn :8000)</text>
  <text x="795" y="575" class="card-copy">Amazon Linux 2023 · t3.micro</text>
  <text x="795" y="595" class="card-copy">Valida JWT con Cognito JWKS</text>
  <text x="795" y="615" class="card-copy">Genera URLs prefirmadas y ejecuta DELETE</text>

  <!-- Security Group -->
  <rect x="792" y="632" width="346" height="42" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="965" y="658" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Security Group (sg-0108695f0d2701501): TCP/8000</text>

  <!-- Contenedor de Docker status -->
  <rect x="792" y="684" width="346" height="38" rx="8" fill="#ffedd5"/>
  <text x="965" y="707" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">Contenedor: edustream-backend (status: running)</text>

  <!-- ================= CAPA DE DATOS Y ALMACENAMIENTO ================= -->
  <!-- DynamoDB Videos -->
  <rect x="1265" y="375" width="335" height="165" rx="14" fill="#ffffff" stroke="#4338ca" stroke-width="2"/>
  <rect x="1265" y="375" width="335" height="38" rx="14" fill="#4338ca"/>
  <path d="M1265 400h335v13H1265z" fill="#4338ca"/>
  <text x="1285" y="401" class="card-header-text">Amazon DynamoDB · Videos</text>
  <text x="1285" y="442" class="card-title">EduStream_Videos (PK: video_id)</text>
  <text x="1285" y="465" class="card-copy">Metadatos, status (pending / ready), owner_sub</text>
  <rect x="1283" y="482" width="300" height="42" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1433" y="500" text-anchor="middle" font-size="12" font-weight="800" fill="#5b21b6">TTL ACTIVADO en atributo 'ttl'</text>
  <text x="1433" y="516" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">Elimina subidas huérfanas tras 2 horas</text>

  <!-- DynamoDB Subjects -->
  <rect x="1265" y="565" width="335" height="125" rx="14" fill="#ffffff" stroke="#4338ca" stroke-width="2"/>
  <rect x="1265" y="565" width="335" height="38" rx="14" fill="#4338ca"/>
  <path d="M1265 590h335v13H1265z" fill="#4338ca"/>
  <text x="1285" y="591" class="card-header-text">Amazon DynamoDB · Materias</text>
  <text x="1285" y="632" class="card-title">EduStream_Subjects (PK: subject_id)</text>
  <text x="1285" y="654" class="card-copy">Catálogo académico: SUB-NUBE, SUB-CLIENTE...</text>
  <text x="1285" y="674" class="small">Datos preestablecidos para asignaturas</text>

  <!-- S3 Videos Bucket -->
  <rect x="1265" y="715" width="335" height="175" rx="14" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <rect x="1265" y="715" width="335" height="38" rx="14" fill="#15803d"/>
  <path d="M1265 740h335v13H1265z" fill="#15803d"/>
  <text x="1285" y="741" class="card-header-text">Amazon S3 · Almacenamiento Videos</text>
  <text x="1285" y="782" class="card-title">edustream-videos-storage-jdavila</text>
  <text x="1285" y="804" class="card-copy">Bucket privado · videos/{video_id}/original.mp4</text>
  <rect x="1283" y="818" width="300" height="56" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1433" y="837" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">CORS: PUT, POST, GET directos</text>
  <text x="1433" y="855" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">Subida multipart y streaming prefirmado</text>

  <!-- ================= CAPA DE SOPORTE E INFRAESTRUCTURA ================= -->
  <!-- IAM LabRole -->
  <rect x="735" y="800" width="460" height="90" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="735" y="800" width="110" height="90" rx="14" fill="#dc2626"/>
  <path d="M831 800h14v90h-14z" fill="#dc2626"/>
  <text x="790" y="852" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">AWS IAM</text>
  <text x="865" y="834" class="card-title">LabRole · Perfil de Instancia EC2</text>
  <text x="865" y="856" class="card-copy">Credenciales temporales efímeras vía IMDSv2</text>
  <text x="865" y="876" class="small">Permisos de lectura/escritura en DynamoDB y S3</text>

  <!-- Scripts de Resiliencia -->
  <rect x="400" y="680" width="280" height="150" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="400" y="680" width="280" height="38" rx="14" fill="#d97706"/>
  <path d="M400 705h280v13H400z" fill="#d97706"/>
  <text x="420" y="706" class="card-header-text">Scripts de Resiliencia (Lab)</text>
  <text x="420" y="746" class="card-title">actualizar-entorno.ps1 / .sh</text>
  <text x="420" y="768" class="card-copy">Detecta cambio de IP en EC2</text>
  <text x="420" y="788" class="card-copy">Actualiza API Gateway e IP en SG</text>
  <rect x="418" y="796" width="244" height="22" rx="5" fill="#fef3c7"/>
  <text x="540" y="812" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Recuperación automática en 4h labs</text>

  <!-- ================= FLUJOS / FLECHAS DE CONEXIÓN ================= -->

  <!-- 1. Carga del Frontend -->
  <path class="edge" d="M280 320 V237 H400" stroke="#0d9488" marker-end="url(#arrow-teal)"/>
  <rect x="250" y="222" width="140" height="24" rx="5" fill="#ffffff"/>
  <text x="320" y="238" text-anchor="middle" class="edge-label" fill="#0f766e">1. Carga SPA (HTTPS)</text>

  <!-- Proxy a S3 Frontend -->
  <path class="edge" d="M680 237 H735" stroke="#0d9488" marker-end="url(#arrow-teal)"/>
  <text x="707" y="228" text-anchor="middle" class="edge-label" fill="#0f766e">Proxy</text>

  <!-- 2. Login OIDC con Cognito -->
  <path class="edge" d="M324 370 H430 V130 H1225 V165" stroke="#a21caf" marker-end="url(#arrow-purple)"/>
  <rect x="460" y="118" width="310" height="24" rx="5" fill="#ffffff"/>
  <text x="615" y="134" text-anchor="middle" class="edge-label" fill="#86198f">2. Login OIDC Hosted UI (PKCE) ➔ Emite JWT con grupos</text>

  <!-- 3. Peticiones API a API Gateway Backend -->
  <path class="edge" d="M324 490 H400" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <rect x="328" y="475" width="68" height="24" rx="5" fill="#ffffff"/>
  <text x="362" y="491" text-anchor="middle" class="edge-label" fill="#1d4ed8">3. API</text>

  <!-- API Gateway ➔ EC2 FastAPI -->
  <path class="edge" d="M680 500 H775" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <rect x="688" y="485" width="80" height="24" rx="5" fill="#ffffff"/>
  <text x="728" y="501" text-anchor="middle" class="edge-label" fill="#1d4ed8">HTTP :8000</text>

  <!-- Backend consulta JWKS a Cognito -->
  <path class="edge" d="M1155 520 H1210 V310" stroke="#a21caf" stroke-dasharray="6 4" marker-end="url(#arrow-purple)"/>
  <rect x="1150" y="340" width="110" height="24" rx="5" fill="#ffffff"/>
  <text x="1205" y="356" text-anchor="middle" class="edge-label" fill="#86198f">Consulta JWKS</text>

  <!-- Backend a DynamoDB Videos -->
  <path class="edge" d="M1155 550 H1265" stroke="#4338ca" marker-end="url(#arrow-blue)"/>
  <text x="1210" y="542" text-anchor="middle" class="edge-label" fill="#3730a3">CRUD + TTL</text>

  <!-- Backend a DynamoDB Subjects -->
  <path class="edge" d="M1155 600 H1265" stroke="#4338ca" marker-end="url(#arrow-blue)"/>
  <text x="1210" y="592" text-anchor="middle" class="edge-label" fill="#3730a3">Lectura materias</text>

  <!-- Backend a S3 Videos (Pre-signed y Delete) -->
  <path class="edge" d="M1155 650 H1230 V750 H1265" stroke="#15803d" marker-end="url(#arrow-green)"/>
  <rect x="1170" y="700" width="135" height="24" rx="5" fill="#ffffff"/>
  <text x="1237" y="716" text-anchor="middle" class="edge-label" fill="#166534">Presigned / Delete</text>

  <!-- Cliente a S3 Videos Directo (Upload / Streaming) -->
  <path class="edge" d="M184 600 V930 H1432 V890" stroke="#15803d" marker-end="url(#arrow-green)"/>
  <rect x="480" y="915" width="560" height="28" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="760" y="934" text-anchor="middle" class="edge-label" fill="#166534">4. Subida directa POST multipart (con barra de progreso) y Streaming GET con URL prefirmada</text>

  <!-- IAM Role a EC2 -->
  <path class="edge" d="M965 800 V736" stroke="#dc2626" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <text x="965" y="780" text-anchor="middle" class="edge-label" fill="#b91c1c">Asocia perfil IAM</text>

  <!-- Script a API Gateway -->
  <path class="edge" d="M540 680 V580" stroke="#d97706" stroke-dasharray="6 4" marker-end="url(#arrow-amber)"/>
  <text x="540" y="635" text-anchor="middle" class="edge-label" fill="#b45309">Sincroniza IP</text>

  <!-- LEYENDA -->
  <rect x="44" y="975" width="1590" height="42" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <line x1="60" y1="996" x2="90" y2="996" stroke="#0d9488" stroke-width="3"/>
  <text x="98" y="1000" class="small">Tráfico Frontend (HTTPS)</text>

  <line x1="280" y1="996" x2="310" y2="996" stroke="#a21caf" stroke-width="3"/>
  <text x="318" y="1000" class="small">Autenticación OIDC / JWKS</text>

  <line x1="510" y1="996" x2="540" y2="996" stroke="#2563eb" stroke-width="3"/>
  <text x="548" y="1000" class="small">Llamadas REST API (JSON)</text>

  <line x1="730" y1="996" x2="760" y2="996" stroke="#15803d" stroke-width="3"/>
  <text x="768" y="1000" class="small">Transferencia Binaria S3 (Directa)</text>

  <line x1="1020" y1="996" x2="1050" y2="996" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="1058" y="1000" class="small">Automatización de Resiliencia</text>

  <line x1="1260" y1="996" x2="1290" y2="996" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="1298" y="1000" class="small">Inyección de Credenciales IAM</text>
</svg>
