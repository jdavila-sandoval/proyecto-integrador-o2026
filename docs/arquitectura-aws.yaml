Diagram:
  DefinitionFiles:
    - Type: URL
      Url: https://raw.githubusercontent.com/awslabs/diagram-as-code/main/definitions/definition-for-aws-icons-light.yaml
  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: vertical
      Children:
        - ApplicationClient
        - AWSCloud

    ApplicationClient:
      Type: AWS::Diagram::Resource
      Title: "Usuarios (Docente / Alumno)\nNavegador Web · SPA React"

    AWSCloud:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Direction: vertical
      Title: "AWS · us-east-1"
      Children:
        - EdgeAndAuth
        - BackendLayer
        - DataLayer
        - IAMAndResilience

    EdgeAndAuth:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - FrontendGateway
        - FrontendBucket
        - Cognito
        - BackendGateway

    FrontendGateway:
      Type: AWS::ApiGateway
      Title: "API Gateway (Frontend Proxy)\nHTTPS · 4q76jvcjwa"

    FrontendBucket:
      Type: AWS::S3::Bucket
      Title: "Amazon S3 (Frontend)\nedustream-frontend-jdavila\nStatic Website Hosting"

    Cognito:
      Type: AWS::Cognito::UserPool
      Title: "Amazon Cognito\nUser Pool: us-east-1_rNhUTDMSd\nHosted UI · OIDC/PKCE · grupos"

    BackendGateway:
      Type: AWS::ApiGateway
      Title: "API Gateway (Backend API)\nHTTPS · j72eps3z3f\nCORS: * · HTTP Proxy :8000"

    BackendLayer:
      Type: AWS::EC2::VPC
      Title: "Amazon VPC · Subred Pública"
      Direction: vertical
      Children:
        - EC2Backend

    EC2Backend:
      Type: AWS::EC2::Instance
      Title: "Amazon EC2 (i-0da66503c5157fdcd)\nDocker · FastAPI + Uvicorn :8000\nSecurity Group: TCP/8000 + TCP/22"

    DataLayer:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - VideosTable
        - SubjectsTable
        - VideosBucket

    VideosTable:
      Type: AWS::DynamoDB::Table
      Title: "Amazon DynamoDB\nEduStream_Videos\nTTL activado (2h para pending)"

    SubjectsTable:
      Type: AWS::DynamoDB::Table
      Title: "Amazon DynamoDB\nEduStream_Subjects\nCatálogo de materias"

    VideosBucket:
      Type: AWS::S3::Bucket
      Title: "Amazon S3 (Videos)\nedustream-videos-storage-jdavila\nBucket privado · CORS habilitado"

    IAMAndResilience:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - InstanceRole
        - ResilienceScript

    InstanceRole:
      Type: AWS::IAM::Role
      Title: "AWS IAM · LabRole\nPerfil de instancia EC2\nCredenciales temporales IMDSv2"

    ResilienceScript:
      Type: AWS::Diagram::Resource
      Title: "Scripts de Resiliencia\nactualizar-entorno.ps1 / .sh\nSincroniza IP EC2 en API Gateway"

  Links:
    - Source: ApplicationClient
      Target: FrontendGateway
      TargetArrowHead:
        Type: Open
      Labels:
        AutoRight:
          Title: "1. Carga SPA (HTTPS)"

    - Source: FrontendGateway
      Target: FrontendBucket
      TargetArrowHead:
        Type: Open
      Labels:
        AutoRight:
          Title: "Proxy a S3 Website"

    - Source: ApplicationClient
      Target: Cognito
      TargetArrowHead:
        Type: Open
      Labels:
        AutoRight:
          Title: "2. Login Hosted UI (OIDC/PKCE)"

    - Source: Cognito
      Target: ApplicationClient
      TargetArrowHead:
        Type: Open
      Labels:
        AutoRight:
          Title: "Emite id_token JWT (grupo)"

    - Source: ApplicationClient
      Target: BackendGateway
      TargetArrowHead:
        Type: Open
      Labels:
        AutoRight:
          Title: "3. API Calls (HTTPS + Bearer JWT)"

    - Source: BackendGateway
      Target: EC2Backend
      TargetArrowHead:
        Type: Open
      Labels:
        AutoRight:
          Title: "Proxy HTTP :8000"

    - Source: EC2Backend
      Target: Cognito
      TargetArrowHead:
        Type: Open
      Labels:
        AutoRight:
          Title: "Valida JWT con JWKS"

    - Source: EC2Backend
      Target: VideosTable
      TargetArrowHead:
        Type: Open
      Labels:
        AutoRight:
          Title: "CRUD Videos + TTL"

    - Source: EC2Backend
      Target: SubjectsTable
      TargetArrowHead:
        Type: Open
      Labels:
        AutoRight:
          Title: "Lee materias"

    - Source: EC2Backend
      Target: VideosBucket
      TargetArrowHead:
        Type: Open
      Labels:
        AutoRight:
          Title: "Genera URLs prefirmadas / Delete"

    - Source: ApplicationClient
      Target: VideosBucket
      TargetArrowHead:
        Type: Open
      Labels:
        AutoRight:
          Title: "4. Upload POST / Streaming GET directo"

    - Source: InstanceRole
      Target: EC2Backend
      TargetArrowHead:
        Type: Open
      Labels:
        AutoRight:
          Title: "Permisos DynamoDB y S3"

    - Source: ResilienceScript
      Target: BackendGateway
      TargetArrowHead:
        Type: Open
      Labels:
        AutoRight:
          Title: "Actualiza IP de integración"
